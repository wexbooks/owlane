<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hong Kong Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main id="dashboard" class="dashboard">
        <!-- Current Time & Profile Tile -->
        <section class="tile time-tile">
            <div class="time-header">
                <h1 id="time">--:--:--</h1>
                <p id="date">Loading...</p>
            </div>
            <div class="profile-selector">
                <button class="profile-btn" data-profile="work" onclick="switchProfile('work')">💼 返工</button>
                <button class="profile-btn" data-profile="offwork" onclick="switchProfile('offwork')">🏠 放工</button>
                <button class="profile-btn" data-profile="holiday" onclick="switchProfile('holiday')">🎉 放假</button>
            </div>
        </section>

        <!-- Weather Tile -->
        <section class="tile weather-tile persistent-tile">
            <h2>Weather (HKO)</h2>
            <div id="weather-info" class="tile-content">
                <div class="loader"></div>
            </div>
        </section>

        <!-- Tide Tile -->
        <section class="tile tide-tile persistent-tile">
            <h2>Tide (Tai Po Kau)</h2>
            <p class="subtitle">3-Day Forecast</p>
            <div id="tide-info" class="tile-content scrollable">
                <div class="loader"></div>
            </div>
        </section>
        
        <!-- Bus tiles will be injected here -->
    </main>
    <script src="app.js"></script>
</body>
</html>
